<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prévia — Vitória da Wânia</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#241407;font-family:Arial,sans-serif;color:#2f210f}
body{padding:20px}.wrap{width:min(900px,100%);margin:auto}.card{background:#fff8e7;border:4px solid #d49a20;border-radius:22px;padding:24px;text-align:center}
h1{margin:0 0 8px}.sub{margin:0 0 20px;color:#705e47}
.stage{display:flex;justify-content:center;align-items:flex-end;gap:28px;flex-wrap:wrap}
.person{width:min(42%,260px)}.person img{width:100%;max-height:320px;object-fit:cover;object-position:top;border-radius:18px;border:3px solid #d49a20;background:#fff}
.name{font-weight:800;font-size:20px;margin-top:8px}.result{font-size:24px;font-weight:900;margin:22px 0 10px}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
button{border:0;border-radius:12px;padding:11px 16px;font-weight:700;background:#2f210f;color:white;cursor:pointer}
@keyframes victory{0%,100%{transform:translateY(0) rotate(0)}20%{transform:translateY(-18px) rotate(-4deg)}40%{transform:translateY(0) rotate(4deg)}60%{transform:translateY(-12px) rotate(-3deg)}80%{transform:translateY(0) rotate(3deg)}}
@keyframes nope{0%,100%{transform:rotate(0)}15%{transform:rotate(-7deg)}30%{transform:rotate(7deg)}45%{transform:rotate(-7deg)}60%{transform:rotate(7deg)}75%{transform:rotate(-4deg)}}
.victory{animation:victory 1.1s ease-in-out 3;transform-origin:50% 85%}.nope{animation:nope .85s ease-in-out 3;transform-origin:50% 25%}
@media(prefers-reduced-motion:reduce){.victory,.nope{animation:none}}
</style></head>
<body><main class="wrap"><section class="card">
<h1>Prévia do final da enquete</h1><p class="sub">Wânia comemora a vitória e Darli reage com reprovação.</p>
<div class="result">🏆 WÂNIA VENCEU — VAI DE ÔNIBUS! 🚌</div>
<div class="stage">
  <div class="person"><img id="wania" src="wania-enquete.png" alt="Wânia"><div class="name">Wânia 🎉</div></div>
  <div class="person"><img id="darli" src="darli-enquete.png" alt="Darli"><div class="name">Darli 😒</div></div>
</div>
<div class="controls"><button id="play" type="button">▶ Ver movimento novamente</button></div>
</section></main>
<script>
const w=document.getElementById('wania'),d=document.getElementById('darli');
function play(){w.classList.remove('victory');d.classList.remove('nope');void w.offsetWidth;w.classList.add('victory');d.classList.add('nope')}
document.getElementById('play').addEventListener('click',play);play();
</script></body></html>
