<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Galeria - Mapa de Férias</title><style>
body{font-family:Arial,sans-serif;margin:0;background:#f7edd7;color:#3b210f}.wrap{max-width:1100px;margin:auto;padding:20px}.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}a{color:#5a2e0b}.tabs{display:flex;gap:10px;margin:18px 0}button{border:0;border-radius:999px;padding:10px 18px;font-weight:700;cursor:pointer}button.active{background:#5a2e0b;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}.card{background:#fff;border-radius:14px;padding:8px;box-shadow:0 2px 10px #0002}.card img,.card video{width:100%;height:220px;object-fit:cover;border-radius:10px;background:#111}.empty{background:#fff;padding:22px;border-radius:14px}.comments{margin-top:28px;background:#fff;padding:18px;border-radius:14px}input,textarea{width:100%;box-sizing:border-box;margin:7px 0;padding:10px;border:1px solid #c9b089;border-radius:8px}.comments button{background:#5a2e0b;color:#fff;border-radius:8px}.comment{border-top:1px solid #eee;padding:10px 0}.small{font-size:13px;color:#765}</style></head><body><div class="wrap"><div class="top"><div><h1 id="title">Galeria</h1><div class="small">Fotos e vídeos da viagem</div></div><a href="index.html">← Voltar ao mapa</a></div><div class="tabs"><button id="btnFotos">📷 Fotos</button><button id="btnVideos">🎥 Vídeos</button></div><div id="grid" class="grid"></div><div id="empty" class="empty" hidden>Nenhum arquivo publicado nesta galeria ainda.</div><section class="comments"><h2>Comentários</h2><input id="nome" placeholder="Seu nome"><textarea id="texto" rows="3" placeholder="Escreva um comentário"></textarea><button id="publicar">Publicar comentário</button><div id="lista"></div></section></div><script src="data/midias.js"></script><script src="comentarios-publicos.js"></script>
<script>const qs=new URLSearchParams(location.search),stage=qs.get('p')||'casa';let tab=qs.get('tab')||'fotos';const labels={casa:'Minha Casa',uber:'Uber',tiete:'Rodoviária do Tietê',congonhas:'Aeroporto de Congonhas',maceio:'Maceió'};title.textContent=labels[stage]||'Galeria';
async function load(){const data=window.MIDIAS||{};const staticItems=(data[stage]&&data[stage][tab])||[];let dynamic=[];try{const r=await fetch(`/api/media?stage=${encodeURIComponent(stage)}&kind=${encodeURIComponent(tab)}`,{cache:'no-store'});if(r.ok){const j=await r.json();dynamic=(j.items||[]).map(x=>x.url)}}catch{}const items=[...new Set([...staticItems,...dynamic])];grid.innerHTML='';empty.hidden=items.length>0;for(const src of items){const card=document.createElement('div');card.className='card';if(tab==='fotos'){const img=document.createElement('img');img.loading='lazy';img.src=src;img.alt='Foto da viagem';card.appendChild(img)}else{const v=document.createElement('video');v.controls=true;v.preload='metadata';v.src=src;card.appendChild(v)}grid.appendChild(card)}btnFotos.classList.toggle('active',tab==='fotos');btnVideos.classList.toggle('active',tab==='videos')}
btnFotos.onclick=()=>{tab='fotos';history.replaceState(null,'',`?p=${stage}&tab=fotos`);load()};btnVideos.onclick=()=>{tab='videos';history.replaceState(null,'',`?p=${stage}&tab=videos`);load()};load();
const key='mapaFeriasComentarios:'+stage;function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function renderComments(){const arr=JSON.parse(localStorage.getItem(key)||'[]');lista.innerHTML=arr.map(x=>`<div class="comment"><b>${esc(x.nome)}</b><div>${esc(x.texto)}</div></div>`).join('')}publicar.onclick=()=>{const n=nome.value.trim(),t=texto.value.trim();if(!n||!t)return;const arr=JSON.parse(localStorage.getItem(key)||'[]');arr.unshift({nome:n,texto:t});localStorage.setItem(key,JSON.stringify(arr.slice(0,100)));texto.value='';renderComments()};renderComments();
</script><script src="comentarios-publicos.js"></script></body></html>
