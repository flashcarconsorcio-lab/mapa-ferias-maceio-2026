<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Galeria - Mapa de Férias</title><style>
body{font-family:Arial,sans-serif;margin:0;background:#f7edd7;color:#3b210f}.wrap{max-width:1100px;margin:auto;padding:20px}.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}a{color:#5a2e0b}.tabs{display:flex;gap:10px;margin:18px 0}button{border:0;border-radius:999px;padding:10px 18px;font-weight:700;cursor:pointer}button.active{background:#5a2e0b;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}.card{background:#fff;border-radius:14px;padding:8px;box-shadow:0 2px 10px #0002}.card img,.card video{width:100%;height:220px;object-fit:contain;border-radius:10px;background:#111}.empty{background:#fff;padding:22px;border-radius:14px}.comments{margin-top:28px;background:#fff;padding:18px;border-radius:14px}input,textarea{width:100%;box-sizing:border-box;margin:7px 0;padding:10px;border:1px solid #c9b089;border-radius:8px}.comments button{background:#5a2e0b;color:#fff;border-radius:8px}.comment{border-top:1px solid #eee;padding:10px 0}.small{font-size:13px;color:#765} .card img{cursor:zoom-in}.expand{display:block;width:100%;margin-top:8px;background:#5a2e0b;color:white}.viewer{width:min(95vw,1200px);max-width:none;max-height:95vh;border:0;border-radius:14px;background:#111;color:white}.viewer::backdrop{background:#000d}.viewer-controls{display:flex;justify-content:space-between;gap:10px;margin-bottom:10px}.viewer-controls button{background:white;color:#222}.viewer-frame{height:78vh;overflow:auto;display:flex;align-items:center;justify-content:center}.viewer-frame img,.viewer-frame video{max-width:100%;max-height:100%;object-fit:contain}.viewer-frame.zoom{display:block;text-align:center}.viewer-frame.zoom img{max-width:none;max-height:none;width:auto;height:auto;cursor:zoom-out}.viewer-stage{position:relative}.viewer-arrow{position:absolute;z-index:3;top:50%;transform:translateY(-50%);display:grid;place-items:center;width:48px;height:56px;padding:0;border:2px solid #fff;border-radius:14px;background:#075a96e8;color:#fff;font-size:34px;line-height:1;box-shadow:0 3px 10px #0008}.viewer-arrow:hover,.viewer-arrow:focus-visible{background:#087ac1;outline:3px solid #fff;outline-offset:2px}.viewer-arrow.prev{left:8px}.viewer-arrow.next{right:8px}.viewer-arrow[hidden]{display:none}@media(max-width:600px){.viewer{width:100vw;max-height:100vh;padding:10px}.viewer-frame{height:76vh}.viewer-arrow{width:38px;height:50px;font-size:28px}.viewer-arrow.prev{left:2px}.viewer-arrow.next{right:2px}}</style></head><body><div class="wrap"><div class="top"><div><h1 id="title">Galeria</h1><div class="small">Fotos e vídeos da viagem</div></div><a href="index.html">← Voltar ao mapa</a></div><div class="tabs"><button id="btnFotos">📷 Fotos</button><button id="btnVideos">🎥 Vídeos</button></div><div id="grid" class="grid"></div><div id="empty" class="empty" hidden>Nenhum arquivo publicado nesta galeria ainda.</div><dialog id="viewer" class="viewer" aria-label="Mídia ampliada"><div class="viewer-controls"><button id="toggleZoom" type="button">Ampliar foto</button><button id="closeViewer" type="button">Fechar ✕</button></div><div class="viewer-stage"><div id="viewerFrame" class="viewer-frame"></div><button id="prevPhoto" class="viewer-arrow prev" type="button" aria-label="Foto anterior" hidden>‹</button><button id="nextPhoto" class="viewer-arrow next" type="button" aria-label="Próxima foto" hidden>›</button></div></dialog><section class="comments"><h2>Comentários</h2><input id="nome" placeholder="Seu nome"><textarea id="texto" rows="3" placeholder="Escreva um comentário"></textarea><button id="publicar">Publicar comentário</button><div id="lista"></div></section></div><script src="data/midias.js"></script><script src="comentarios-publicos.js"></script>
<script>const qs=new URLSearchParams(location.search),stage=qs.get('p')||'casa';let tab=qs.get('tab')||'fotos';const labels={casa:'Minha Casa',uber:'Uber',tiete:'Rodoviária do Tietê',congonhas:'Aeroporto de Congonhas',maceio:'Maceió','maceio-dia-1':'Maceió — Dia 1','maceio-dia-2':'Maceió — Dia 2','maceio-dia-3':'Maceió — Dia 3','maceio-dia-4':'Maceió — Dia 4','maceio-dia-5':'Maceió — Dia 5'};title.textContent=labels[stage]||'Galeria';
let photos=[],photoIndex=-1;
function openMedia(src,isPhoto,index=-1){
 photoIndex=isPhoto?index:-1;
 viewerFrame.replaceChildren();viewerFrame.classList.remove('zoom');viewerFrame.scrollTop=0;viewerFrame.scrollLeft=0;
 toggleZoom.hidden=!isPhoto;toggleZoom.textContent='Ampliar foto';
 prevPhoto.hidden=nextPhoto.hidden=!isPhoto||photos.length<2;
 const el=document.createElement(isPhoto?'img':'video');el.src=src;
 if(isPhoto){el.alt='Foto ampliada';el.onclick=()=>toggleZoom.click()}else{el.controls=true;el.playsInline=true}
 viewerFrame.appendChild(el);if(!viewer.open)viewer.showModal();
}
function movePhoto(direction){if(photoIndex<0||photos.length<2)return;photoIndex=(photoIndex+direction+photos.length)%photos.length;openMedia(photos[photoIndex],true,photoIndex)}
prevPhoto.onclick=()=>movePhoto(-1);nextPhoto.onclick=()=>movePhoto(1);
viewer.addEventListener('keydown',event=>{if(photoIndex<0||event.altKey||event.ctrlKey||event.metaKey)return;if(event.key==='ArrowLeft'||event.key==='ArrowRight'){event.preventDefault();movePhoto(event.key==='ArrowLeft'?-1:1)}});
closeViewer.onclick=()=>viewer.close();
viewer.addEventListener('close',()=>{viewerFrame.replaceChildren();viewerFrame.classList.remove('zoom');photoIndex=-1});
toggleZoom.onclick=()=>{const z=viewerFrame.classList.toggle('zoom');toggleZoom.textContent=z?'Ajustar à tela':'Ampliar foto'};
async function load(){const data=window.MIDIAS||{};const staticItems=(data[stage]&&data[stage][tab])||[];let dynamic=[];try{const r=await fetch(`/api/media?stage=${encodeURIComponent(stage)}&kind=${encodeURIComponent(tab)}`,{cache:'no-store'});if(r.ok){const j=await r.json();dynamic=(j.items||[]).map(x=>x.url)}}catch{}const items=[...new Set([...staticItems,...dynamic])];grid.innerHTML='';photos=tab==='fotos'?items:[];empty.hidden=items.length>0;for(const [index,src] of items.entries()){const card=document.createElement('div');card.className='card';if(tab==='fotos'){const img=document.createElement('img');img.loading='lazy';img.src=src;img.alt='Ampliar foto da viagem';img.tabIndex=0;img.setAttribute('role','button');img.onclick=()=>openMedia(src,true,index);img.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openMedia(src,true,index)}};card.appendChild(img)}else{const v=document.createElement('video');v.controls=true;v.preload='metadata';v.src=src;card.appendChild(v);const b=document.createElement('button');b.type='button';b.className='expand';b.textContent='Ampliar vídeo';b.onclick=()=>{v.pause();openMedia(src,false)};card.appendChild(b)}grid.appendChild(card)}btnFotos.classList.toggle('active',tab==='fotos');btnVideos.classList.toggle('active',tab==='videos')}
btnFotos.onclick=()=>{tab='fotos';history.replaceState(null,'',`?p=${stage}&tab=fotos`);load()};btnVideos.onclick=()=>{tab='videos';history.replaceState(null,'',`?p=${stage}&tab=videos`);load()};load();
const key='mapaFeriasComentarios:'+stage;function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function renderComments(){const arr=JSON.parse(localStorage.getItem(key)||'[]');lista.innerHTML=arr.map(x=>`<div class="comment"><b>${esc(x.nome)}</b><div>${esc(x.texto)}</div></div>`).join('')}publicar.onclick=()=>{const n=nome.value.trim(),t=texto.value.trim();if(!n||!t)return;const arr=JSON.parse(localStorage.getItem(key)||'[]');arr.unshift({nome:n,texto:t});localStorage.setItem(key,JSON.stringify(arr.slice(0,100)));texto.value='';renderComments()};renderComments();
</script><script src="comentarios-publicos.js"></script></body></html>
